<!DOCTYPE html>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;

        }
        .nav-link {
            transition: color 0.3s, transform 0.3s;
        }
        .nav-link:hover {
            color: #ff96c5;
            transform: translateY(-2px);
        }
        .card-project {
            transition: all 0.3s;

        .card-project:hover {
            transform: translateY(-5px);

        }
    </style>
    <script>

                        'primary-pink': '#ff96c5',
                        'secondary-pink': '#f3aacb',
                        'light-pink': '#fbd5e5',
                        'dark-gray': '#1f2937',
                        'text-light': '#e5e7eb',
                        'bg-dark': '#0a0a0a',
                    }
                }
            }
        }
    </script>
